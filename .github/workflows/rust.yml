# Rust workspace CI (docs/analysis/rust-rewrite/plan.html, P0).
# The toolchain comes from rust-toolchain.toml.
name: rust

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cmake --version
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # manifold-ffi (the default backend) builds Manifold's C++ from source:
  # it needs git, cmake and a C++ compiler. All three GitHub images ship
  # cmake; the version is printed so a missing one fails loudly here.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cmake --version
      - run: cargo test --workspace --all-targets
      # R2: print every stage hash on each OS, on both backends, so platforms
      # can be compared (the test itself asserts 1/4/16-thread identity).
      - run: cargo test -p dt-geom --features manifold-rust --test determinism -- --nocapture --test-threads 1
      - run: cargo xtask parity

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Moves to dt-eval in P1.
      - run: cargo check -p dt-geom --target wasm32-unknown-unknown --no-default-features --features manifold-rust
      # The document model must stay wasm-safe (no geometry, no std::fs use).
      - run: cargo check -p dt-doc --target wasm32-unknown-unknown

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
