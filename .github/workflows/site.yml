# The documentation site: how it is built and published to GitHub Pages.
#
# Live: Pages takes its source from this workflow (switched 14 Nov 2026).  Nothing else publishes the site, so the
# live site changes only on a release tag or a run by hand ("Run workflow" on the Actions tab, or
# `gh workflow run site.yml`).  CI stays off for the workspace tests (rust.yml is disabled and left alone); this
# workflow is only the site.
#
# What it does, on a release tag (v1.4.0) or by hand:
#   module   the engine as WebAssembly (the WASM toolchain, `cargo xtask wasm`)           cached by the engine's sources
#   posters  the pictures of the examples, named by build key (`cargo xtask examples`)      skipped when it has one
#   pages    the committed docs/, checked with `cargo xtask docs --check`
#   deploy   needs all three, checks they come from one commit, and publishes (actions/deploy-pages)
# and, on a pull request, one quick job: `cargo xtask docs --check`, which fails on a code with no explaining
# section, a marker naming no code, or a stale error page or anchor.
#
# The engine module (about 3.4 MB) changes with every engine change, so it is never committed: the repository stays
# text only, and a prose fix reuses the last module from the cache.

name: site

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"
      - "crates/dt-lang/src/codes.rs"
      - "xtask/**"
      - ".github/workflows/site.yml"

concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # no incremental files: they only make the cached build folders bigger
  CARGO_INCREMENTAL: 0

jobs:
  # The quick check on a pull request: nothing is built for the page, nothing is published.
  docs-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      # The whole build folder, Manifold's C++ included.  rust-cache would drop the third_party crates (they sit
      # inside the workspace but are not members), so Manifold rebuilt on every run; Cargo itself decides what is
      # stale, so a cache from an older commit is only a head start.
      - name: The native build, from the last run
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: native-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            native-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            native-${{ runner.os }}-
      # `docs` runs the program for the element schema, so it builds Manifold's C++ (cmake and a C++ compiler)
      - run: cmake --version
      - run: cargo xtask docs --check

  module:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # the engine's sources: what decides whether the cached module and toolchain are still right
      # (hashFiles works only in steps, not in a job's env)
      - id: engine
        run: echo "key=${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/dt-lang/**', 'crates/dt-value/**', 'crates/dt-doc/**', 'crates/dt-geom/**', 'crates/dt-kit/**', 'crates/dt-elements/**', 'crates/dt-eval/**', 'crates/dt-par/**', 'crates/dt-web/**', 'third_party/**', 'library/**', 'web/wasm/**', 'xtask/src/wasm.rs') }}" >> "$GITHUB_OUTPUT"
      - name: The module, if this engine has one already
        id: cached
        uses: actions/cache@v4
        with:
          path: out/site-module
          key: module-${{ steps.engine.outputs.key }}
      - name: The WASM toolchain
        if: steps.cached.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          sudo apt-get update
          # Manifold's C++ for wasm needs a recent LLVM with wasm32 support and its libc++ headers (the build
          # looks in /usr/lib/llvm-<n>/bin, 22 down to 18).  Ubuntu's own LLVM 18 has the headers but they do not
          # compile for wasm32 through the shim, so LLVM 22 comes from LLVM's own apt repository (apt.llvm.org);
          # on the Mac it is Homebrew's llvm.
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 22
          sudo apt-get install -y cmake libc++-22-dev libc++abi-22-dev binaryen
          /usr/lib/llvm-22/bin/clang++ --version
          test -d /usr/lib/llvm-22/include/c++/v1
      # Only reached when the engine changed, so the build folder is restored from the last engine's: keying it by
      # this engine would never match.  Cargo decides what is stale.
      - name: The wasm build, from the last engine
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: wasm-${{ runner.os }}-${{ steps.engine.outputs.key }}
          restore-keys: |
            wasm-${{ runner.os }}-
      - name: wasm-bindgen, at the version Cargo.lock holds
        if: steps.cached.outputs.cache-hit != 'true'
        run: |
          V=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/[^0-9.]/, ""); print; exit }' Cargo.lock)
          test -n "$V" || { echo "no wasm-bindgen in Cargo.lock"; exit 1; }
          # the project's own release build of it, not a compile from source
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$V/wasm-bindgen-$V-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo install "wasm-bindgen-$V-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/
          wasm-bindgen --version
      - name: cargo xtask wasm
        if: steps.cached.outputs.cache-hit != 'true'
        run: cargo xtask wasm out/site-module
      - run: echo "${{ steps.sha.outputs.sha }}" > out/site-module/COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: module
          path: out/site-module
          if-no-files-found: error

  # The posters: a picture of every example (docs/examples/), named by the build's cache key, which is the name the
  # committed pages already carry (`cargo xtask docs --check` holds that).  An example that has its picture already, from
  # the cache of an earlier run, is skipped: its name is the key of everything its build reads.  Pages are not
  # generated here; the posters are the one generated part.
  posters:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install
      # the same native build folder as the pages job: `cargo xtask examples` runs the program
      - name: The native build, from the last run
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: native-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            native-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            native-${{ runner.os }}-
      - name: The posters made by earlier runs
        uses: actions/cache@v4
        with:
          path: out/site-posters
          key: posters-${{ github.sha }}
          restore-keys: posters-
      - run: cmake --version
      - run: cargo xtask examples --out out/site-posters
      - run: echo "${{ steps.sha.outputs.sha }}" > out/site-posters/COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: posters
          path: out/site-posters
          if-no-files-found: error

  pages:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install
      # The whole build folder, Manifold's C++ included.  rust-cache would drop the third_party crates (they sit
      # inside the workspace but are not members), so Manifold rebuilt on every run; Cargo itself decides what is
      # stale, so a cache from an older commit is only a head start.
      - name: The native build, from the last run
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: native-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            native-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            native-${{ runner.os }}-
      - run: cmake --version
      # The site is the committed docs/, exactly: they were generated on the Mac, and here they are only checked
      # (fails on a stale controls table, anchor or error page, or a code with no explaining section).
      - run: cargo xtask docs --check
      - run: |
          mkdir -p out/site-pages
          cp -R docs/. out/site-pages/
          echo "${{ steps.sha.outputs.sha }}" > out/site-pages/COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: pages
          path: out/site-pages
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request'
    needs: [module, posters, pages]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: The three parts come from one commit
        run: |
          set -e
          echo "run:     ${{ github.sha }}"
          echo "module:  ${{ needs.module.outputs.sha }}"
          echo "posters: ${{ needs.posters.outputs.sha }}"
          echo "pages:   ${{ needs.pages.outputs.sha }}"
          for s in "${{ needs.module.outputs.sha }}" "${{ needs.posters.outputs.sha }}" "${{ needs.pages.outputs.sha }}"; do
            test "$s" = "${{ github.sha }}" || { echo "the module, posters and pages are not from one commit"; exit 1; }
          done
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Put the site together
        run: |
          set -e
          mkdir site
          cp -R parts/pages/. site/
          # the cards read the engine from engine/ and the posters from posters/, beside the pages
          mkdir -p site/engine site/posters
          cp -R parts/module/. site/engine/
          cp -R parts/posters/. site/posters/
          for part in pages module posters; do
            test "$(cat parts/$part/COMMIT)" = "${{ github.sha }}" || { echo "the $part artifact is from another commit"; exit 1; }
          done
          rm site/COMMIT site/engine/COMMIT site/posters/COMMIT
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
