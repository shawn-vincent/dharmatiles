[package]
edition = "2024"
name = "obvhs"
version = "0.4.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "BVH Construction and Traversal Library"
homepage = "https://github.com/DGriffin91/obvhs"
readme = "README.md"
keywords = [
    "bvh",
    "sah",
    "aabb",
    "cwbvh",
    "ploc",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/DGriffin91/obvhs"

[features]
parallel = [
    "dep:rayon",
    "dep:thread_local",
    "rdst/multi-threaded",
]
profile = ["dep:profiling"]
profile-with-optick = ["profiling/profile-with-optick"]
profile-with-puffin = ["profiling/profile-with-puffin"]
profile-with-superluminal = ["profiling/profile-with-superluminal"]
profile-with-tracing = ["profiling/profile-with-tracing"]
profile-with-tracy = ["profiling/profile-with-tracy"]
small_bvh2_node = []
timeit = []

[lib]
name = "obvhs"
path = "src/lib.rs"







[dependencies.bytemuck]
version = "1"
features = [
    "derive",
    "extern_crate_alloc",
]

[dependencies.glam]
# dharmatiles: 0.34 only (the published ">=0.33, <0.35"), so the vendored copy
# resolves to the glam the workspace already uses and the lock does not move.
version = ">=0.34, <0.35"
features = ["bytemuck"]

[dependencies.half]
version = "2"

[dependencies.log]
version = "0.4"

[dependencies.profiling]
version = "1"
optional = true

[dependencies.rayon]
version = "1"
optional = true

[dependencies.rdst]
version = "0.20"
default-features = false

[dependencies.static_assertions]
version = "1"

[dependencies.thread_local]
version = "1"
optional = true

[dev-dependencies.argh]
version = "0.1"

[dev-dependencies.image]
version = "0.25"
features = ["png"]
default-features = false

[dev-dependencies.minifb]
version = "0.28"

[dev-dependencies.obj]
version = "0.10"
features = ["genmesh"]

[dev-dependencies.rayon]
version = "1"

[dev-dependencies.ruzstd]
version = "0.8"

[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.release-with-debug]
debug = 2
inherits = "release"
