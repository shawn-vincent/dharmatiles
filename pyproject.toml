[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dharmatiles"
version = "0.1.0"
description = "Procedural 3D-printable terrain tiles"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "trimesh",
    "embreex",  # fast Embree ray backend — trimesh falls back to a pure-Python
                # ray engine without it, making mesh.contains ~90× slower (the
                # leaf-oval containment gate dominated tree-tile generation).
    "xxhash",   # fast hash backend for trimesh's mesh-cache validation — without
                # it trimesh falls back to blake2b, run on every geometry-property
                # access. Roughly halves embree per-call overhead in leaf
                # placement (~14% off a tree tile). See docs/meta/history/
                # 2026-07-03-organic-leaf-placer-performance-analysis.md.
    "scipy",
    "pyyaml",
    "manifold3d",
    "rich",
    "Pillow",
]

[project.scripts]
dharmatiles-gen    = "dharmatiles.terrains.tile:main"
dharmatiles-logo   = "dharmatiles.logo_render:main"
generate-build-info = "scripts.generate_build_info:main"

[tool.setuptools.packages.find]
where = ["src"]
