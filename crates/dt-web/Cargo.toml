[package]
name = "dt-web"
description = "dharmatiles in the browser: the language crates (dt-lang, dt-value, dt-doc) behind wasm-bindgen, built by `cargo xtask wasm`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# The language crates, and the engine behind dt-eval (stage 2): the browser build
# runs Manifold through wasm-cxx-shim, and rayon is `rayon-seq` there.
[dependencies]
dt-doc.workspace = true
dt-value.workspace = true
dt-eval.workspace = true
dt-kit.workspace = true
dt-print.workspace = true
sha2.workspace = true
miette.workspace = true
serde.workspace = true
serde_json.workspace = true

# The TypeScript of the engine's answers (docs/assets/live/engine-wire.d.ts): made by this crate's tests only, so the
# browser build carries no more of ts-rs than dt-eval's own derives bring
[dev-dependencies]
ts-rs.workspace = true

# The browser's Manifold (wasm-cxx-shim) only for the browser: on the host,
# where `cargo test --workspace` builds dt-web beside the program, the engine
# and Manifold are the program's own, built once.
[target.'cfg(target_arch = "wasm32")'.dependencies]
dt-eval = { workspace = true, features = ["wasm"] }
# the browser's bindings, only for the browser: on the host its proc macros would ask for another `syn`, and every
# crate of the program that derives serde would be built twice (feature drift)
wasm-bindgen = "=0.2.130"

# The workspace forbids unsafe code; wasm-bindgen's generated glue is unsafe,
# so this crate takes the workspace's clippy lints and leaves that one out.
[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
float_cmp = "warn"
cast_possible_truncation = "warn"
