[package]
name = "dt-service"
description = "The editor's service, below every transport: the Storage trait for the files it reads and writes (and one in memory), and the Clock; it reads no disk, speaks no HTTP and builds on wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

# The owner's `Command::Inspect`, a test's look into the state: the program's tests turn it on, nothing else.
[features]
inspect = []

[dependencies]
dt-value.workspace = true
dt-lang.workspace = true
dt-doc.workspace = true
dt-eval.workspace = true
dt-elements.workspace = true
dt-kit.workspace = true
dt-print.workspace = true
kdl.workspace = true
libm.workspace = true
miette.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true

# The browser's Manifold (wasm-cxx-shim) only for the browser, as in dt-web: on the host the engine is the program's
# own, built once with the same features.
[target.'cfg(target_arch = "wasm32")'.dependencies]
dt-eval = { workspace = true, features = ["wasm"] }

# the one build memo the tests share (the payload's tests build through it)
[dev-dependencies]
dt-testkit.workspace = true
# the test host's kept builds: the lane and an export of a tile share one entry (no_server_verbs)
dt-store.workspace = true

[lints]
workspace = true
