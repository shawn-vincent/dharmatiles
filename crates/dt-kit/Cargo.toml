[package]
name = "dt-kit"
description = "dharmatiles kit: the scene of tagged solids, the operations elements are written in, the audit gate, STL export and the preview renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["manifold-parallel"]
manifold-parallel = ["dt-geom/manifold-parallel"]
wasm = ["dt-geom/wasm"]

[dependencies]
dt-geom.workspace = true
dt-lang.workspace = true
dt-value.workspace = true
libm.workspace = true
parry3d.workspace = true
png.workspace = true
flate2.workspace = true
crc32fast.workspace = true
serde_json.workspace = true

# rayon through dt-par: the one place that runs it sequentially in the browser
rayon = { package = "dt-par", path = "../dt-par" }

[lints]
workspace = true
