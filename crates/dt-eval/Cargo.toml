[package]
name = "dt-eval"
description = "dharmatiles evaluation: project discovery, imports, the plan-then-build scheduler, seeds by path, and the one build call"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[features]
wasm = ["dt-kit/wasm", "dt-elements/wasm"]
[dependencies]
dt-doc.workspace = true
dt-lang.workspace = true
dt-geom.workspace = true
dt-value.workspace = true
dt-kit.workspace = true
dt-elements.workspace = true
kdl.workspace = true
miette.workspace = true
serde_json.workspace = true
# a build's record (`TileRecord`) is one serde struct, and its TypeScript type is the page's
serde.workspace = true
ts-rs.workspace = true

# the resident size a build's stages reach (the browser reads its memory's size instead)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memory-stats.workspace = true

[dev-dependencies]
# the golden tests draw the PNG renders (a dev-dependency cycle: dt-print builds on dt-eval)
dt-print.workspace = true
insta.workspace = true
# the one build memo the tests share (a dev-dependency cycle: dt-testkit builds on dt-eval)
dt-testkit.workspace = true
rayon.workspace = true
miette = { workspace = true, features = ["fancy-no-backtrace"] }

[lints]
workspace = true
