[package]
name = "dt-eval"
description = "dharmatiles evaluation: project discovery, imports, the plan-then-build scheduler, seeds by path, and the one build call"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["manifold-parallel"]
manifold-parallel = ["dt-kit/manifold-parallel", "dt-elements/manifold-parallel"]
# The crash switch the CLI tests drive (DT_TEST_PANIC). Only the dharmatiles
# crate's dev-dependencies turn it on, so no shipped program has it.
test-panic = []
[dependencies]
dt-doc.workspace = true
dt-geom.workspace = true
dt-value.workspace = true
dt-kit.workspace = true
dt-elements.workspace = true
kdl.workspace = true
sha2.workspace = true
miette.workspace = true

[dev-dependencies]
insta.workspace = true
rayon.workspace = true
miette = { workspace = true, features = ["fancy-no-backtrace"] }

[lints]
workspace = true
