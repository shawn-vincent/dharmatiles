[package]
name = "dharmatiles"
description = "dharmatiles: build printable terrain tiles from KDL documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[features]
default = ["manifold-parallel"]
manifold-parallel = ["dt-eval/manifold-parallel"]
# Off in every shipped build: two routes that fail on purpose (`/api/test-panic`,
# `/api/test-failure`), to see the error panel working.  The tests have them anyway.
test-routes = []

[dependencies]
clap.workspace = true
dt-doc.workspace = true
dt-lang.workspace = true
kdl.workspace = true
dt-eval.workspace = true
dt-kit.workspace = true
dt-elements.workspace = true
libm.workspace = true
rayon.workspace = true
miette = { workspace = true, features = ["fancy-no-backtrace"] }
serde_json.workspace = true
serde.workspace = true

[dev-dependencies]
ts-rs.workspace = true
# Test builds only: the DT_TEST_PANIC crash switch the exit-code tests drive.
dt-eval = { workspace = true, features = ["test-panic"] }

[lints]
workspace = true
