[package]
name = "dharmatiles"
description = "dharmatiles: build printable terrain tiles from KDL documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[features]
default = ["manifold-parallel"]
