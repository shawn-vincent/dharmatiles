[package]
name = "dt-looks"
description = "dharmatiles built-in looks, written only in dt-kit's public operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["manifold-ffi", "manifold-parallel"]
manifold-ffi = ["dt-kit/manifold-ffi"]
manifold-rust = ["dt-kit/manifold-rust"]
manifold-parallel = ["dt-kit/manifold-parallel"]

# Only the kit: a look cannot reach into the kernels or another look.
[dependencies]
dt-kit.workspace = true
libm.workspace = true
rayon.workspace = true

[lints]
workspace = true
