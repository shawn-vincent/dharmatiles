[package]
name = "dt-geom"
description = "dharmatiles kernels: grids, 2D, meshes, rays and keyed seeds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# the browser build: Manifold through wasm-cxx-shim, single-threaded
wasm = ["manifold-csg/unstable-wasm-uu"]

[dependencies]
dt-lang.workspace = true
dt-value.workspace = true
bytemuck.workspace = true
glam.workspace = true
libm.workspace = true
# Manifold's C++ library (v3.5.3): needs git, cmake and a C++ compiler;
# the first build compiles Manifold (and TBB off the browser).
manifold-csg = { workspace = true }
manifold-csg-sys = { workspace = true }

# rayon through dt-par: the one place that runs it sequentially in the browser
rayon = { package = "dt-par", path = "../dt-par" }

# obvhs's parallel build is rayon's: off for the browser, where there are no threads
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
obvhs.workspace = true
# Manifold's internal parallelism (TBB in C++) wherever there are threads: the C++ kernel is 3x slower without it,
# and its output is identical run to run on one machine. By the target, not a feature: a feature on by default is
# labelled differently in a workspace build than in the program's, and every engine crate was built twice for it.
manifold-csg = { workspace = true, features = ["parallel"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
obvhs = { version = "0.4.0" }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
