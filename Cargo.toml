# dharmatiles Rust workspace (virtual manifest).
# Plan and architecture: docs/rust/plan.html, docs/rust/architecture.html.
[workspace]
members = ["crates/*", "xtask"]
# dt-web is the browser build (`cargo xtask wasm`): it stays out of a plain
# `cargo build`, so the program's build is the same without it.
default-members = [
    "crates/dharmatiles",
    "crates/dt-doc",
    "crates/dt-elements",
    "crates/dt-eval",
    "crates/dt-geom",
    "crates/dt-kit",
    "crates/dt-lang",
    "crates/dt-store",
    "crates/dt-value",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license-file = "LICENSE"
repository = "https://github.com/shawn-vincent/dharmatiles"
publish = false

# Every external version is stated once, here.
[workspace.dependencies]
# Internal crates. dt-geom's backend is chosen by the crate at the top
# (dt-eval's features), so it is pulled in without default features.
dt-geom = { path = "crates/dt-geom", default-features = false }
dt-lang = { path = "crates/dt-lang" }
dt-value = { path = "crates/dt-value" }
dt-doc = { path = "crates/dt-doc" }
dt-kit = { path = "crates/dt-kit", default-features = false }
dt-elements = { path = "crates/dt-elements", default-features = false }
dt-eval = { path = "crates/dt-eval", default-features = false }
dt-store = { path = "crates/dt-store" }
# KDL v2 only: `kdlv1`/`v1-fallback` stay off, and serde is not needed.
kdl = { version = "6.7.1", default-features = false, features = ["span"] }
miette = { version = "7.6.0", default-features = false }
bytemuck = "1.23.0"
glam = "0.34.2"
obvhs = { version = "0.4.0", features = ["parallel"] }
parry3d = "0.31.1"
rayon = "1.12.0"
# Mesh backend. Parallelism is a compile-time choice (TBB); dt-geom's
# `manifold-parallel` turns it on.
manifold-csg = { version = "=0.4.1", default-features = false }
serde_json = "1"
# The disk cache's key digest (dt-store).
sha2 = "=0.10.9"
serde = { version = "1", features = ["derive"] }
# The page contract: TypeScript types generated from the preview's request and
# response structs (test builds only; the program does not carry it).
ts-rs = { version = "12", default-features = false, features = ["serde-json-impl", "serde-compat", "no-serde-warnings"] }
clap = { version = "4.6.7", features = ["derive"] }
insta = "1.49.0"
# Seeded code uses libm, not std's platform maths (R2: sin/exp differ by OS).
libm = "0.2.16"
png = "0.18.1"
flate2 = "1.1.10"
crc32fast = "1.5.4"

[workspace.lints.rust]
# FFI lives inside the binding crates, not ours.
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
float_cmp = "warn"
cast_possible_truncation = "warn"

# Geometry at opt-level 0 is too slow to judge by eye.
[profile.dev.package."*"]
opt-level = 3
# Our own geometry too: the golden tests build dirt eight times each.
# (Rust does not contract or reorder float maths at any level, so the
# hashes are the same as a release build's.)
[profile.dev.package.dt-geom]
opt-level = 3
[profile.dev.package.dt-value]
opt-level = 3
[profile.dev.package.dt-kit]
opt-level = 3
[profile.dev.package.dt-elements]
opt-level = 3

# Manifold's level set reads one element before a buffer (`vertPos[-1]`) when
# its hash table fills before any vertex has moved, then sizes the table from
# that garbage: the table can come out empty and the next insert faults (a
# rare, intermittent SIGSEGV in the wall and floor builds). The vendored
# `manifold-csg-sys` is the published 3.5.105 with one carried patch for it
# (third_party/manifold-csg-sys/patches); drop the vendored copy once Manifold
# has the fix.
[patch.crates-io]
manifold-csg-sys = { path = "third_party/manifold-csg-sys" }
# obvhs 0.4.0 with its builders' `Instant` replaced by a clock that does not
# run on wasm32, where std's `Instant::now()` panics (third_party/obvhs/src/
# instant.rs); the rest is the published source.  Drop it once obvhs has the fix.
obvhs = { path = "third_party/obvhs" }
