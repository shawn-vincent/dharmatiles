<title>Blocky Rock Study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: a study, then rules, then a bench. The words sit beside plates; tables are computed from data/rocks.json in the page.
   Cool stone greys; models are plain grey on the references' dark stage. Red and orange are never used on a model (they mean overhang in dharmatiles). */
:root{
  --bg:#eef0f2;--panel:#f8f9fa;--fg:#1c2129;--muted:#5a6472;--rule:#d0d6dd;--stage:#4a4a4e;--ink:#2a2f38;--accent:#3557c9;--accent-soft:#c9d3f2;
  --a-out:#2f9d8c;--a-gap:#7a3fc4;--a-ax:#b0188f;--a-dim:#6b7a12;--err:#b3261e;
  --text:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--head:"Space Grotesk","Inter",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--panel:#181c22;--fg:#e4e8ed;--muted:#98a2af;--rule:#2c333d;--ink:#0c0e11;--accent:#93a8ff;--accent-soft:#2c3866;--a-out:#3fd0bb;--a-gap:#b78cff;--a-ax:#f06fd2;--a-dim:#b9cc4a;--err:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--panel:#181c22;--fg:#e4e8ed;--muted:#98a2af;--rule:#2c333d;--ink:#0c0e11;--accent:#93a8ff;--accent-soft:#2c3866;--a-out:#3fd0bb;--a-gap:#b78cff;--a-ax:#f06fd2;--a-dim:#b9cc4a;--err:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--text);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:1180px;margin:0 auto;padding-block:28px 72px}
h1,h2,h3{font-family:var(--head);font-weight:600;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4vw,42px);line-height:1.08;letter-spacing:-.01em}
h2{font-size:clamp(22px,2.6vw,28px);line-height:1.2}
h3{font-size:17px;line-height:1.3}
p{margin:0}b{font-weight:600}a{color:var(--accent)}
code,.num{font-family:var(--mono);font-size:.88em;font-variant-numeric:tabular-nums}
.lede{max-width:68ch;color:var(--muted);font-size:16px;margin-top:10px}
.ev{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--head);letter-spacing:.05em;text-transform:uppercase;padding:3px 7px 3px 5px;border-radius:3px;border:1px solid var(--rule);background:var(--panel);color:var(--fg);white-space:nowrap;vertical-align:.1em}
.ev::before{content:"";width:9px;height:9px;flex:none;border:1.5px solid currentColor}
.ev.m::before{background:currentColor}
.ev.e::before{background:linear-gradient(135deg,currentColor 50%,transparent 50%)}
.ev.p::before{border-style:dashed;border-radius:50%}
.key{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 22px;padding:14px 16px;border:1px solid var(--rule);background:var(--panel);border-radius:4px;font-size:13.5px;line-height:1.45;margin-top:18px}
.chapters{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chapters a{display:flex;gap:6px;align-items:baseline;padding:4px 10px;border:1px solid var(--rule);border-radius:99px;color:var(--fg);text-decoration:none;font-size:13px;background:var(--panel)}
.chapters a span{font:600 12px var(--head);color:var(--accent)}
.ch{padding:44px 0 8px;border-top:1px solid var(--rule);margin-top:40px;scroll-margin-top:12px;display:grid;gap:22px}
.ch>header{display:grid;gap:8px;max-width:74ch}
.ch>header .n{font:600 13px var(--head);color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.ch>header p{color:var(--muted);font-size:16px}
.sec{display:grid;grid-template-columns:minmax(0,38ch) minmax(0,1fr);gap:18px 36px;align-items:start;padding-top:10px}
.sec.full{grid-template-columns:minmax(0,1fr)}
.words{display:grid;gap:11px;align-content:start;min-width:0}
.words p,.words li{font-size:14.5px}
.words ul,.words ol{margin:0;padding-left:1.15em;display:grid;gap:5px}
.plates{display:grid;gap:14px;min-width:0}
figure{margin:0;display:grid;gap:6px;min-width:0}
figcaption{font-size:13px;color:var(--muted);line-height:1.45;max-width:86ch}
.plate{border:1px solid var(--rule);background:var(--panel);border-radius:3px;overflow:hidden;min-width:0}
.plate>img,.plate>canvas{display:block;width:100%;height:auto}
.pad{padding:12px 14px}
.stage{background:var(--stage)}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.cell{position:relative;min-width:0;background:var(--stage);border-radius:2px;overflow:hidden}
.cell canvas,.cell img{display:block;width:100%;height:auto}
.cell .tag{position:absolute;left:4px;top:4px;font:600 11px/1 var(--mono);padding:3px 5px;background:var(--ink);color:#fff;border-radius:2px;pointer-events:none}
.cell .sub{position:absolute;left:4px;bottom:4px;right:4px;font:11.5px/1.3 var(--text);color:#fff;text-shadow:0 1px 2px #000}
table{border-collapse:collapse;font-size:13.5px;width:100%}
th,td{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--rule);vertical-align:top}
th{font:600 12px var(--head);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;min-width:0}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--rule);padding:2px 0 2px 12px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}
.rule{display:grid;gap:6px;align-content:start;padding:12px 14px;border:1px solid var(--rule);border-left:3px solid var(--accent);background:var(--panel);border-radius:3px;font-size:14px;min-width:0}
.rule h3{font-size:15px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rule h3 .rn{font:600 12px var(--mono);color:var(--accent)}
.rule.k{border-left-color:var(--a-gap)}
.rule p,.rule li{font-size:13.8px}.rule ul{margin:0;padding-left:1.1em;display:grid;gap:3px}
.heat td.h{text-align:center;font:12px var(--mono);padding:5px 6px;min-width:34px}
.bench{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,310px);gap:16px;align-items:start}
@media (max-width:860px){.bench{grid-template-columns:minmax(0,1fr)}.sec{grid-template-columns:minmax(0,1fr)}}
.live{position:relative;width:100%;aspect-ratio:4/3;background:var(--stage);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.live>canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
.live>canvas:active{cursor:grabbing}
.side{display:grid;gap:14px;min-width:0}
.grp{display:grid;gap:6px;min-width:0}
.grp>label,.grp>span{font:600 12px var(--head);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.seedrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
input[type=number]{font:15px var(--mono);width:7.5em;padding:6px 8px;border:1px solid var(--rule);border-radius:3px;background:var(--panel);color:var(--fg)}
button,select{font:500 14px var(--text);padding:6px 12px;border:1px solid var(--rule);border-radius:99px;background:var(--panel);color:var(--fg);cursor:pointer}
select{border-radius:3px;max-width:100%;width:100%}
button.main{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.read{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;margin:0;font-size:13px}
.read dt{color:var(--muted)}.read dd{margin:0;font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.sheet{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.sheet .cell{cursor:pointer}.sheet .cell.sel{outline:3px solid var(--accent);outline-offset:-3px}
.beside{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.beside{grid-template-columns:minmax(0,1fr)}}
.mark{position:absolute;transform:translate(-50%,-50%);font:600 10.5px/1 var(--head);letter-spacing:.03em;padding:2px 4px;border-radius:2px;background:var(--accent);color:#fff;white-space:nowrap;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.mark::before{content:"";position:absolute;left:50%;top:100%;width:0;height:0;border:4px solid transparent;border-top-color:var(--accent);transform:translateX(-50%)}
.mark.sp{background:#7a3fc4}.mark.sp::before{border-top-color:#7a3fc4}
.mark.st{background:#0f8f7e}.mark.st::before{border-top-color:#0f8f7e}
.mark.ch{background:#b0188f}.mark.ch::before{border-top-color:#b0188f}
.mark.fc{background:#3557c9}.mark.fc::before{border-top-color:#3557c9}
.mark.bd{background:#6b7a12}.mark.bd::before{border-top-color:#6b7a12}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
