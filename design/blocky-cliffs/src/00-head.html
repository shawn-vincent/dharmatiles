<title>Blocky Cliff Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: an atlas. A short statement of the answer opens the page, then numbered chapters, each a column of words beside plates
   of diagrams. Neutrals are cool stone greys; forms are drawn in plain grey on the stage grey. Annotation colours keep one meaning
   each through the whole page (see the key). Red and orange are never used on a form: in dharmatiles they mean overhang. */
:root{
  --bg:#eef0f2;--panel:#f8f9fa;--fg:#1c2129;--muted:#5a6472;--rule:#d0d6dd;--stage:#8c8c91;--stone:#c9ccd1;--stone2:#aeb2b9;--stone3:#8f949c;--ink:#2a2f38;
  --accent:#3557c9;--accent-soft:#c9d3f2;
  --a-out:#2f5fd0;   /* a stone's outline */
  --a-top:#0f8f7e;   /* top faces, ledges, levels */
  --a-gap:#7a3fc4;   /* joints, clefts, the space between stones */
  --a-ax:#b0188f;    /* axes: lean, dip, direction */
  --a-dim:#6b7a12;   /* dimensions and scale */
  --err:#b3261e;
  --text:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--head:"Space Grotesk","Inter",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--panel:#181c22;--fg:#e4e8ed;--muted:#98a2af;--rule:#2c333d;--ink:#0c0e11;--accent:#93a8ff;--accent-soft:#2c3866;--a-out:#7fa2ff;--a-top:#3fd0bb;--a-gap:#b78cff;--a-ax:#f06fd2;--a-dim:#b9cc4a;--err:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--panel:#181c22;--fg:#e4e8ed;--muted:#98a2af;--rule:#2c333d;--ink:#0c0e11;--accent:#93a8ff;--accent-soft:#2c3866;--a-out:#7fa2ff;--a-top:#3fd0bb;--a-gap:#b78cff;--a-ax:#f06fd2;--a-dim:#b9cc4a;--err:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--text);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:1240px;margin:0 auto;padding-block:28px 72px}
h1,h2,h3{font-family:var(--head);font-weight:600;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4vw,42px);line-height:1.08;letter-spacing:-.01em}
h2{font-size:clamp(22px,2.6vw,28px);line-height:1.2}
h3{font-size:17px;line-height:1.3}
p{margin:0}
b{font-weight:600}
a{color:var(--accent)}
code,.num{font-family:var(--mono);font-size:.88em;font-variant-numeric:tabular-nums}
.lede{max-width:66ch;color:var(--muted);font-size:16px;margin-top:10px}
.intro{display:grid;gap:4px;margin-bottom:24px}

/* how sure: three kinds of statement, each with its own mark, used on every number and every diagram */
.ev{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--head);letter-spacing:.05em;text-transform:uppercase;padding:3px 7px 3px 5px;border-radius:3px;border:1px solid var(--rule);background:var(--panel);color:var(--fg);white-space:nowrap;vertical-align:1px}
.ev::before{content:"";width:9px;height:9px;flex:none;border:1.5px solid currentColor}
.ev.m::before{background:currentColor}                          /* measured from a trace */
.ev.e::before{background:linear-gradient(135deg,currentColor 50%,transparent 50%)}   /* estimated by eye */
.ev.p::before{border-style:dashed;border-radius:50%}            /* proposed for a generator */
.ev.r::before{border-style:dotted}                               /* reconstructed: hidden in the pictures */
.key{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 22px;padding:14px 16px;border:1px solid var(--rule);background:var(--panel);border-radius:4px;font-size:13.5px;line-height:1.45}
.key>div{display:grid;gap:4px;align-content:start;min-width:0}
.key .sw{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px}

.chapters{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chapters a{display:flex;gap:6px;align-items:baseline;padding:4px 10px;border:1px solid var(--rule);border-radius:99px;color:var(--fg);text-decoration:none;font-size:13px;background:var(--panel)}
.chapters a span{font:600 12px var(--head);color:var(--accent)}
.chapters a:hover,.chapters a:focus-visible{border-color:var(--accent);outline:none}

.ch{padding:48px 0 8px;border-top:1px solid var(--rule);margin-top:40px;scroll-margin-top:12px;display:grid;gap:22px}
.ch>header{display:grid;gap:8px;max-width:74ch}
.ch>header .n{font:600 13px var(--head);color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.ch>header p{color:var(--muted);font-size:16px}
.sec{display:grid;grid-template-columns:minmax(0,38ch) minmax(0,1fr);gap:18px 36px;align-items:start;padding-top:10px}
.sec.full{grid-template-columns:minmax(0,1fr)}
.sec.full>.words{max-width:74ch}
.words{display:grid;gap:11px;align-content:start;min-width:0}
.words p,.words li{font-size:14.5px}
.words ul,.words ol{margin:0;padding-left:1.15em;display:grid;gap:5px}
.plates{display:grid;gap:14px;min-width:0}
figure{margin:0;display:grid;gap:6px;min-width:0}
figcaption{font-size:13px;color:var(--muted);line-height:1.45;max-width:86ch}
.plate{border:1px solid var(--rule);background:var(--panel);border-radius:3px;overflow:hidden;min-width:0}
.plate>svg,.plate>canvas,.plate>img{display:block;width:100%;height:auto}
.stage{background:var(--stage)}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.row.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.row.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.row.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
.cell{position:relative;min-width:0}
.cell img,.cell svg,.cell canvas{display:block;width:100%;height:auto}
.cell .tag{position:absolute;left:4px;top:4px;font:600 11px/1 var(--head);padding:3px 5px;background:var(--ink);color:#fff;border-radius:2px;pointer-events:none}
.cell .sub{font-size:12px;color:var(--muted);line-height:1.35;padding:3px 1px 0}
table{border-collapse:collapse;font-size:13.5px;width:100%}
th,td{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--rule);vertical-align:top}
th{font:600 12px var(--head);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;min-width:0}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--rule);padding:2px 0 2px 12px}
.ctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13.5px}
.ctl label{display:inline-flex;gap:8px;align-items:center;min-width:0}
.ctl input[type=range]{accent-color:var(--accent);width:150px;max-width:100%}
.ctl output{font:12.5px var(--mono);min-width:3.2em}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pills button{font:500 13px var(--text);padding:3px 11px;border:1px solid var(--rule);border-radius:99px;background:var(--panel);color:var(--fg);cursor:pointer}
.pills button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pills button:focus-visible,.ctl input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
pre{margin:0;padding:12px 14px;background:var(--panel);border:1px solid var(--rule);border-radius:3px;font:12.5px/1.55 var(--mono);overflow-x:auto;min-width:0}
svg text{font-family:var(--text);fill:var(--fg)}
svg .mut{fill:var(--muted)}
@media (max-width:860px){
  .sec{grid-template-columns:minmax(0,1fr)}
  .row.c4,.row.c5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row.c3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
.tr .o{fill:transparent;stroke:var(--a-out);stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.tr .t{fill:var(--a-top);fill-opacity:.22;stroke:var(--a-top);stroke-width:1.4;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.tr.dim{opacity:.18}
.tr.on .o{fill:var(--a-out);fill-opacity:.28;stroke-width:3}
.cell.stage{overflow:hidden;border-radius:2px}
.chart{min-width:0;width:100%}
.chart svg{display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.plate.pad{padding:12px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:860px){.two,.three{grid-template-columns:minmax(0,1fr)}}
.stat{display:grid;gap:2px}
.stat b{font:600 22px/1.1 var(--head);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px 18px}
.rule{display:grid;gap:6px;padding:12px 14px;border:1px solid var(--rule);border-left:3px solid var(--accent);background:var(--panel);border-radius:3px;font-size:14px}
.rule h3{font-size:15px}
.chain{display:grid;gap:4px;font-size:13.5px}
.chain div{display:grid;grid-template-columns:8.2em minmax(0,1fr);gap:8px}
.chain div>span:first-child{font:600 11.5px/1.7 var(--head);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
@media (max-width:520px){.chain div{grid-template-columns:minmax(0,1fr);gap:0}}
</style>
<style>
.insp{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.insp{grid-template-columns:minmax(0,1fr)}}
#insp-table tr.on td{background:var(--accent-soft)}
#insp-grid .cell.sel{outline:3px solid var(--accent);outline-offset:-3px}
#insp-grid .cell:focus-visible{outline:3px solid var(--fg);outline-offset:-3px}
.taxrow{display:grid;grid-template-columns:minmax(0,26ch) minmax(0,1fr);gap:8px 18px;padding:12px 0;border-top:1px solid var(--rule);align-items:start}
.taxrow p{font-size:13.5px;color:var(--muted)}.taxrow .ids{font-family:var(--mono);font-size:12px}
@media (max-width:700px){.taxrow{grid-template-columns:minmax(0,1fr)}}
</style>
<style>
.catrow{display:grid;grid-template-columns:minmax(0,34ch) minmax(0,1fr);gap:10px 28px;padding:16px 0;border-top:1px solid var(--rule);align-items:start}
.catrow:first-child{border-top:0}
@media (max-width:860px){.catrow{grid-template-columns:minmax(0,1fr)}}
</style>
<style>.row,.two,.three{align-items:start}.cell{align-self:start}
td.yes{color:var(--a-top);font-weight:600}td.no{color:var(--muted)}
.bracket{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center}.bracket i{display:inline-block;width:26px;height:8px;border:2px solid var(--a-top);border-top:0}
.out .cell{opacity:.62}.out .sub::after{content:" Leaves the style.";font-style:italic}
</style>
<style>
.live{position:relative;width:100%;aspect-ratio:100/78;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.live>canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
.live>canvas:active{cursor:grabbing}
</style>
<style>.dimmed .cell{opacity:.5}.dimmed .sub::after{content:" out";font-style:italic}
@media (max-width:860px){#sens .row{grid-template-columns:repeat(3,minmax(0,1fr))!important}#motifs .row{grid-template-columns:repeat(3,minmax(0,1fr))!important}}
</style>
<style>.answer{margin-top:28px;padding:20px;border:1px solid var(--rule);background:var(--panel);border-radius:4px;display:grid;gap:8px}
.answer ol{padding-left:1.2em}.answer li{font-size:14.5px}
@media (max-width:520px){.answer{padding:14px}}</style>
<style>.redrawn img{opacity:0}.redrawn .tr .o{fill:#b9bcc2;stroke:#3c4048;stroke-width:1.4}.redrawn .tr .t{fill:#d6d9de;fill-opacity:1;stroke:#3c4048;stroke-width:1}.redrawn .tr.on .o{fill:var(--a-out);fill-opacity:1}</style>
<style>
.jn polyline{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.jn.op polyline{stroke:var(--a-gap);stroke-width:2.4}
.jn.op polyline.w{stroke-dasharray:5 4;stroke-width:1.8}
.jn.dy polyline{stroke:var(--a-ax);stroke-width:3.2}
.jn.dy polyline.w{stroke-dasharray:5 4;stroke-width:2.4}
.jn.dy polyline.f{stroke:var(--a-top);stroke-width:3.2;stroke-dasharray:1 5}
.jn .end{fill:var(--panel);stroke:var(--a-top);stroke-width:2;vector-effect:non-scaling-stroke}
.jn.on polyline{stroke-width:5.5}
#jn-table tr.on td{background:var(--accent-soft)}
#jn-grid .cell.sel{outline:3px solid var(--accent);outline-offset:-3px}
#jn-grid .cell:focus-visible{outline:3px solid var(--fg);outline-offset:-3px}
#jn-grid .jn polyline{stroke-width:1.8}
.jcloses{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;align-items:start}
.jclose .pair{display:grid;grid-template-columns:1fr 1fr;gap:4px;align-items:start}
.jclose .jstrip{display:block;width:100%;height:34px}
.jclose .mut{color:var(--muted)}
.rule table{font-size:13px}
</style>
