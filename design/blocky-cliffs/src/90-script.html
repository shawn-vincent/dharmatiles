<script>
(() => {
  const AP = 'ABCDEFGHIJKLMNOP'.split('');
  const T = Array.from({ length: 20 }, (_, i) => 'T' + (i + 1)), S = Array.from({ length: 16 }, (_, i) => 'S' + (i + 1));
  const el = (tag, attrs = {}, kids = []) => { const e = document.createElement(tag); for (const k in attrs) { if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); } for (const c of kids) e.append(c); return e; };
  const gallery = (id, names, pre) => { const g = document.getElementById(id); if (!g) return; for (const n of names) g.append(el('div', { class: 'cell stage' }, [el('img', { src: 'img/' + pre + n.toLowerCase() + '.jpg', alt: 'Reference formation ' + n, loading: 'lazy' }), el('span', { class: 'tag', text: n })])); };
  gallery('g-smooth', AP, 'ap-'); gallery('g-squares', AP, 'sq-'); gallery('g-twenty', T, ''); gallery('g-sixteen', S, '');
  const CH = [['c1', 'The four sheets'], ['c2', 'Silhouettes and mass'], ['c3', 'Anatomy of one stone'], ['c4', 'Catalogue of stones'], ['c5', 'Proportions'], ['c6', 'Faces, edges, corners'], ['c7', 'Neighbours'], ['c8', 'Repeated arrangements'], ['c9', 'Hierarchy'], ['c10', 'Randomness'], ['c11', 'The grammar'], ['c12', 'Sensitivity and the style’s edges'], ['c13', 'A generator'], ['c14', 'Rules, ranges, constraints']];
  const nav = document.getElementById('chapters');
  CH.forEach(([id, name], i) => nav.append(el('li', {}, [el('a', { href: '#' + id }, [el('span', { text: String(i + 1) }), name])])));
  const stubs = document.getElementById('stubs');
  CH.forEach(([id, name], i) => { if (document.getElementById(id) || !stubs) return; stubs.append(el('section', { class: 'ch', id }, [el('header', {}, [el('span', { class: 'n', text: 'Chapter ' + (i + 1) }), el('h2', { text: name }), el('p', { text: 'Being measured and drawn.' })])])); });
})();
</script>
