<title>Rock Up Close</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the reference and our view as two equal squares, side by side on a desk, stacked on a phone. Nothing else on the page. */
:root{--bg:#eceff2;--rule:#c8cfd8;--stage:#8c8c91;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--rule:#303945;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161b;--rule:#303945;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1500px;margin:0 auto;padding-block:16px 24px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.duo{grid-template-columns:1fr}}
.box{position:relative;aspect-ratio:1/1;width:100%;max-width:100%;border:1px solid var(--rule);background:var(--stage);overflow:hidden}
.box>*{position:absolute;inset:0;width:100%;height:100%;max-width:none;display:block}
.box>img{object-fit:contain}
.box>canvas{touch-action:none;cursor:grab}
.box>.ctl{inset:auto 10px 10px 10px;width:auto;height:auto;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 12px;padding:6px 12px;border-radius:6px;background:rgba(20,22,26,.55);color:#f2f3f5;font:13px/1.2 system-ui,sans-serif}
.ctl output{min-width:6.4em;text-align:right;font-variant-numeric:tabular-nums}
/* a slider with one or two handles: a drawn track and fill, the inputs over it showing only their handles */
.rng{position:relative;height:22px}
.rng::before,.rng>i{content:"";position:absolute;top:10px;height:2px;border-radius:1px}
.rng::before{left:0;right:0;background:rgba(255,255,255,.3)}
.rng>i{background:#9cc3ff}
.rng input{position:absolute;inset:0;width:100%;height:100%;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.rng input::-webkit-slider-runnable-track{background:none;border:0}
.rng input::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:#9cc3ff;border:0;cursor:pointer}
.rng input::-moz-range-thumb{pointer-events:auto;width:14px;height:14px;border-radius:50%;background:#9cc3ff;border:0;cursor:pointer}
.rng input::-moz-range-track{background:none}
.rng input:focus-visible::-webkit-slider-thumb{outline:2px solid #fff;outline-offset:1px}
.rng input:focus-visible::-moz-range-thumb{outline:2px solid #fff;outline-offset:1px}
/* the build's progress: a thin line along the top of the view */
.box>.prog{inset:0 auto auto 0;height:2px;width:0;background:rgba(255,255,255,.75);opacity:0;transition:width .12s linear,opacity .5s}
.box>.prog.on{opacity:1;transition:width .12s linear,opacity .1s}
</style>
<main>
  <div class="duo">
    <div class="box"><img src="img/block-ref.jpg" alt="The reference block: a smooth pale stone block, about twice as long as it is wide, its faces broken into broad scalloped facets with crisp ridges between them"></div>
    <div class="box" id="stage"><canvas id="view" aria-label="Our model, drawn anew: the same block with every face broken into shallow dishes between crisp ridges that run over its edges, seen from the reference's camera. Drag to turn, double-click to return."></canvas><div class="prog" id="prog"></div><div class="ctl">
      <span id="small-l">small turns</span><div class="rng"><i></i><input type="range" id="small" min="0" max="40" step="1" aria-labelledby="small-l"></div><output id="small-v"></output>
      <span id="large-l">large turns</span><div class="rng"><i></i><input type="range" id="large" min="0" max="90" step="1" aria-labelledby="large-l"></div><output id="large-v"></output>
      <span id="sink-l">ridge sink</span><div class="rng"><i></i><input type="range" id="sink" min="0" max="2" step="0.05" aria-labelledby="sink-l"></div><output id="sink-v"></output>
      <span id="sharp-l">sharpness</span><div class="rng"><i></i><input type="range" id="sharp" min="0" max="1" step="0.05" aria-labelledby="sharp-l"></div><output id="sharp-v"></output>
      <span id="stretch-l">stretch</span><div class="rng"><i></i><input type="range" id="stretch" min="1" max="3" step="0.1" aria-labelledby="stretch-l"></div><output id="stretch-v"></output>
    </div></div>
    <div class="box"><img src="img/block-lines.jpg" alt="The block's plain shape with the ridges traced off the reference drawn on its top, long face and left end as a net of dark lines"></div>
    <div class="box"><img src="img/block-scallop.jpg" alt="The model made from those traced ridges: the block's top, long face and left end scalloped into shallow dishes between the ridges, the block's own edges between those faces gone"></div>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

(function () {

    stretch: 1.8,         /* each dish is drawn out along a direction of its own by up to this much, so the cells are uneven (a slider) */
    squash: 1.4,          /* dishes on the sides are this much wider than tall (the picture's are long and low, like courses) */

    large: { every: [4, 9], turn: 45 },      /* and a lot now and then (a slider) */
    turn: [8, 30],        /* where two runs meet the ridge turns by between these many degrees (a slider) */
    sink: { most: .5, across: [3, 7] },   /* a ridge's crest sinks by up to `most` mm, rising and falling over this many mm (a slider) */
    round: 2.4,           /* the block's edges and corners are rounded this much before the ridges are laid on it */
    grid: .12,            /* the surface's grid step */
    depthPerWidth: 1 / 7.5, deepest: 1.9,  /* a dish is as deep as its width times this, never deeper than that */

  };

    { nx: NL, ny: NH, c: [A[0], B[0], B[3], A[3]] },   /* near */
    { nx: NL, ny: NH, c: [B[1], A[1], A[2], B[2]] },   /* far */
    { nx: NW, ny: NH, c: [A[1], A[0], A[3], A[2]] },   /* left end */
    { nx: NW, ny: NH, c: [B[0], B[1], B[2], B[3]] },   /* right end */

        before them; so the dishes are of mixed sizes and evenly spread. Each is drawn out along a direction of its own, by a
        stretch of its own, so the cells are uneven and long in different ways.

        but turning a little often (FEEL.small) and a lot now and then (FEEL.large). The small turns mostly steer back toward the
        even line, the large ones go either way, so a ridge zigzags unevenly without wandering off.
     3. Every point of the surface belongs to the dish it lies on the near side of every ridge for: of its three nearest dishes,

        so the block's own edges and corners are gone and the ridges are the only edges left.

    { id: 'large', get: () => FEEL.large.turn, set: (v) => { FEEL.large.turn = v; }, say: (v) => 'up to ' + v + '°' },
    { id: 'sink', get: () => FEEL.sink.most, set: (v) => { FEEL.sink.most = v; }, say: (v) => 'up to ' + v.toFixed(2) + ' mm' },
    { id: 'sharp', get: () => FEEL.sharp, set: (v) => { FEEL.sharp = v; }, say: (v) => Math.round(v * 100) + '%' },
    { id: 'stretch', get: () => FEEL.stretch, set: (v) => { FEEL.stretch = v; }, say: (v) => v.toFixed(1) + '×' }
