<title>Rock Up Close</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the reference and our view as two equal squares, side by side on a desk, stacked on a phone. Nothing else on the page. */
:root{--bg:#eceff2;--rule:#c8cfd8;--stage:#8c8c91;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--rule:#303945;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161b;--rule:#303945;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1500px;margin:0 auto;padding-block:16px 24px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.duo{grid-template-columns:1fr}}
.box{position:relative;aspect-ratio:1/1;width:100%;max-width:100%;border:1px solid var(--rule);background:var(--stage);overflow:hidden}
.box>*{position:absolute;inset:0;width:100%;height:100%;max-width:none;display:block}
.box>img{object-fit:contain}
.box>canvas{touch-action:none;cursor:grab}
</style>
<main>
  <div class="duo">
    <div class="box"><img src="img/block-ref.jpg" alt="The reference block: a smooth pale stone block, about twice as long as it is wide, its faces broken into broad scalloped facets with crisp ridges between them"></div>
    <div class="box" id="stage"><canvas id="view" aria-label="Our model, drawn anew: the same block with every face broken into shallow dishes between crisp ridges that run over its edges, seen from the reference's camera. Drag to turn, double-click to return."></canvas></div>
    <div class="box"><img src="img/block-lines.jpg" alt="The block's plain shape with the ridges traced off the reference drawn on its top, long face and left end as a net of dark lines"></div>
    <div class="box"><img src="img/block-scallop.jpg" alt="The model made from those traced ridges: the block's top, long face and left end scalloped into shallow dishes between the ridges, the block's own edges between those faces gone"></div>
  </div>
</main>

    for (let i = 0; i < n; i++) { const d = fDish[members[start[i]]]; if (area[i] === largest[d]) continue;

      if (fPin[k]) { const o = toward[k], f = shift[k]; for (let t = 0; t < 3; t++) xyz[3 * k + t] = F.base[3 * k + t] + (F.base[3 * o + t] - F.base[3 * k + t]) * f; onBlock(xyz, k); sag[k] = 0; }
      else { xyz[3 * k] = x; xyz[3 * k + 1] = y; xyz[3 * k + 2] = z; sag[k] = h * scale; }
    }
    /* a link to a crest point counts by how near the crest really is (a grid step over its length), so a point just beside a
       crest that moved close stays shallow, and one it moved away from sinks: the depth grows evenly away from the true ridge */
    for (let k = 0; k < F.N; k++) for (let e = F.off[k]; e < F.off[k + 1]; e++) { const o = F.nbr[e];

    top.fill(0); for (let k = 0; k < F.N; k++) if (sag[k] > top[piece[k]]) top[piece[k]] = sag[k];
    for (let k = 0; k < F.N; k++) {

      const d = tp > 0 && sag[k] > 0 ? full * Math.pow(sag[k] / tp, 1 - FEEL.sharp) : 0;
