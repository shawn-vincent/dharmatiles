<title>Rock Up Close</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the reference and our view as two equal squares, side by side on a desk, stacked on a phone. Nothing else on the page. */
:root{--bg:#eceff2;--rule:#c8cfd8;--stage:#8c8c91;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--rule:#303945;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161b;--rule:#303945;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1500px;margin:0 auto;padding-block:16px 24px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.duo{grid-template-columns:1fr}}
.box{position:relative;aspect-ratio:1/1;width:100%;max-width:100%;border:1px solid var(--rule);background:var(--stage);overflow:hidden}
.box>*{position:absolute;inset:0;width:100%;height:100%;max-width:none;display:block}
.box>img{object-fit:contain}
.box>canvas{touch-action:none;cursor:grab}
</style>
<main>
  <div class="duo">
    <div class="box"><img src="img/block-ref.jpg" alt="The reference block: a smooth pale stone block, about twice as long as it is wide, its faces broken into broad scalloped facets with crisp ridges between them"></div>
    <div class="box" id="stage"><canvas id="view" aria-label="Our model, drawn anew: the same block with every face broken into shallow dishes between crisp ridges that run over its edges, seen from the reference's camera. Drag to turn, double-click to return."></canvas></div>
    <div class="box"><img src="img/block-lines.jpg" alt="The block's plain shape with the ridges traced off the reference drawn on its top, long face and left end as a net of dark lines"></div>
    <div class="box"><img src="img/block-scallop.jpg" alt="The model made from those traced ridges: the block's top, long face and left end scalloped into shallow dishes between the ridges, the block's own edges between those faces gone"></div>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    for (let i = 0; i < t.length; i += 3) { const a = 3 * t[i], b = 3 * t[i + 1], c = 3 * t[i + 2];
      const ux = cXyz[b] - cXyz[a], uy = cXyz[b + 1] - cXyz[a + 1], uz = cXyz[b + 2] - cXyz[a + 2], vx = cXyz[c] - cXyz[a], vy = cXyz[c + 1] - cXyz[a + 1], vz = cXyz[c + 2] - cXyz[a + 2];
      const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx; cOut[a] += nx; cOut[a + 1] += ny; cOut[a + 2] += nz; cOut[b] += nx; cOut[b + 1] += ny; cOut[b + 2] += nz; cOut[c] += nx; cOut[c + 1] += ny; cOut[c + 2] += nz; }
    partition(F, fDish, settled);
    for (let k = 0; k < F.N; k++) { fPin[k] = F.box[3 * k + 2] < 1e-6 ? 2 : 0; if (!fPin[k]) for (let e = F.off[k]; e < F.off[k + 1]; e++) if (fDish[F.nbr[e]] > fDish[k]) { fPin[k] = 1; break; } }
    const scale = (FEEL.coarse / FEEL.fine) ** 2;
    for (let k = 0; k < F.N; k++) {
      let x = 0, y = 0, z = 0, h = 0, nx = 0, ny = 0, nz = 0;
      for (let q = 4 * k; q < 4 * k + 4; q++) { const c = from[q], w = weight[q]; x += w * cXyz[3 * c]; y += w * cXyz[3 * c + 1]; z += w * cXyz[3 * c + 2]; h += w * cSag[c]; nx += w * cOut[3 * c]; ny += w * cOut[3 * c + 1]; nz += w * cOut[3 * c + 2]; }
      const l = Math.hypot(nx, ny, nz) || 1; dir[3 * k] = nx / l; dir[3 * k + 1] = ny / l; dir[3 * k + 2] = nz / l;
      if (fPin[k]) { xyz[3 * k] = F.base[3 * k]; xyz[3 * k + 1] = F.base[3 * k + 1]; xyz[3 * k + 2] = F.base[3 * k + 2]; sag[k] = 0; }
      else { xyz[3 * k] = x; xyz[3 * k + 1] = y; xyz[3 * k + 2] = z; sag[k] = h * scale; }
    }
    relax(F, fPin, xyz, sag, FEEL.sweeps.fine);
    top.fill(0); for (let k = 0; k < F.N; k++) if (sag[k] > top[fDish[k]]) top[fDish[k]] = sag[k];
    /* Beside a ridge the grid only knows which side a point is on, so its crest would follow the grid's staircase. There a point's
       depth is its distance to the ridge (its smallest margin, which follows the walk between grid points) times the dish wall's
       slope at its rim (a dish of full depth D and width W, curved as the sag curves, leaves its rim at 4D / W), and the crest
       runs where the ridge does; never deeper than the sag gives, in case the nearest margin is to the wrong ridge. */
    const v = new Float64Array(K), c = new Int32Array(K);
    for (let k = 0; k < F.N; k++) {
      const w = fDish[k], tp = top[w], wide = 4 * Math.sqrt(tp) * FEEL.fine, full = Math.min(FEEL.deepest, wide * FEEL.depthPerWidth);
      let d = tp > 0 && sag[k] > 0 ? full * sag[k] / tp : 0, edge = false;
      if (fPin[k] !== 2) for (let e = F.off[k]; e < F.off[k + 1]; e++) if (fDish[F.nbr[e]] !== w) { edge = true; break; }
      if (edge && wide > 0) {
        const x = F.box[3 * k], y = F.box[3 * k + 1], z = F.box[3 * k + 2], nx = F.out[3 * k], ny = F.out[3 * k + 1], nz = F.out[3 * k + 2], vw = reach(x, y, z, w, nx, ny, nz);
        let m = Infinity; for (let s2 = 0; s2 < K; s2++) { const j = F.near[k * K + s2]; if (j === w) continue; const mj = margin(x, y, z, nx, ny, nz, w, j, vw, reach(x, y, z, j, nx, ny, nz)); if (mj < m) m = mj; }
        d = Math.min(d, Math.max(0, m) * 4 * full / wide);
      }
      /* a dish darkens toward its bottom, as a hollow gets less of the light around it, and brightens a little at its crests */
      const p = full > 0 ? d / full : 0, q = 1 - p, c = 1 - FEEL.hollow * p * p + FEEL.tip * q * q * q * q;
      for (let t = 0; t < 3; t++) { pos[3 * k + t] = xyz[3 * k + t] - dir[3 * k + t] * d; shade[3 * k + t] = c; }
    }
    geo.attributes.position.needsUpdate = true; geo.attributes.color.needsUpdate = true; geo.computeVertexNormals(); geo.computeBoundingSphere();
  }

  /* ---- the view ---- */
  const renderer = new T.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  const scene = new T.Scene(), cam = new T.PerspectiveCamera(CAM.fov, 1, 10, 2000); cam.up.set(0, 0, 1);
  const controls = new T.OrbitControls(cam, canvas); controls.enablePan = false; controls.addEventListener('change', draw);
  function home() {
    const a = CAM.az * Math.PI / 180, e = CAM.el * Math.PI / 180, t = CAM.target;
    cam.position.set(t[0] + CAM.dist * Math.cos(e) * Math.sin(a), t[1] - CAM.dist * Math.cos(e) * Math.cos(a), t[2] + CAM.dist * Math.sin(e));
    controls.target.set(t[0], t[1], t[2]); controls.update();
  }
  const block = new T.Mesh(geo, new T.MeshStandardMaterial({ color: 0xececee, roughness: 1, metalness: 0, vertexColors: true })); scene.add(block);
  /* the block floats, with no ground and no shadows. A soft light all round, part of it even and part coming from above, behind and
     to the right, so the far side has some shape too; and one lamp out past its left end, low and a little in front, pointing at the
     near left top corner, so its light rakes along the top and the near face and the dishes show by their shading */
  const fill = new T.DirectionalLight(0xffffff, .2); fill.position.set(50, 60, 45);
  scene.add(new T.AmbientLight(0xffffff, .38), new T.HemisphereLight(0xffffff, 0x8c8c90, .2), fill);
  const lamp = new T.SpotLight(0xffffff, .34, 0, Math.PI / 4, 1); lamp.position.set(-72, -16, 34); lamp.target.position.set(-16.3, -7.4, 12.25);
  scene.add(lamp, lamp.target);
  function draw() { renderer.render(scene, cam); }
  function size() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); draw(); }
  canvas.addEventListener('dblclick', () => { home(); draw(); });

  shape(); home(); size();
  if ('ResizeObserver' in window) new ResizeObserver(size).observe(stage); else window.addEventListener('resize', size);
})();
</script>
